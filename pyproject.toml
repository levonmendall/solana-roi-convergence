[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-roi-convergence"
version = "0.5.1"
description = "Paper-only forward-validation and economic-certification engine for Solana, FOMO, and Robinhood Chain v5.1 strategies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "uvicorn==0.52.4",
  "websockets==17.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
solana-roi = "solana_roi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
