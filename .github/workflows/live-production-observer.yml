name: Live Production Certification Observer

on:
  push:
    branches:
      - certification/live-production-observer-fb660df

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live production certification surfaces
        env:
          BASE_URL: https://solana-roi-convergence.onrender.com
          EXPECTED_RELEASE: a590df54c17d6d9ab9d201412b23dad48e1dfc30
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_RELEASE"]
          out = pathlib.Path("observer-output")
          out.mkdir(parents=True, exist_ok=True)

          endpoints = {
              "health": "/health",
              "e2e-status": "/v1/strategy/e2e-status",
              "e2e-status-cache": "/v1/strategy/e2e-status/cache",
              "production-composition": "/v1/operations/production-composition",
              "production-proof": "/v1/strategy/production-proof",
              "production-proof-cache": "/v1/strategy/production-proof/cache",
              "batch9-continuity": "/v1/strategy/batch9-continuity",
          }

          def fetch(name, path):
              started = time.monotonic()
              req = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "solana-roi-certification-observer/3"},
                  method="GET",
              )
              result = {"name": name, "path": path, "method": "GET"}
              body = b""
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read()
                      result["http_status"] = int(resp.status)
                      result["content_type"] = resp.headers.get("Content-Type")
              except urllib.error.HTTPError as exc:
                  result["http_status"] = int(exc.code)
                  result["content_type"] = exc.headers.get("Content-Type") if exc.headers else None
                  body = exc.read()
                  result["error"] = f"HTTPError:{exc.code}"
              except Exception as exc:
                  result["error"] = f"{type(exc).__name__}:{exc}"
              result["latency_ms"] = round((time.monotonic() - started) * 1000, 3)
              text = body.decode("utf-8", errors="replace")
              (out / f"{name}.body.txt").write_text(text, encoding="utf-8")
              try:
                  parsed = json.loads(text) if text else None
              except Exception as exc:
                  parsed = None
                  result["json_error"] = f"{type(exc).__name__}:{exc}"
              result["json"] = parsed
              (out / f"{name}.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True), encoding="utf-8"
              )
              return result

          time.sleep(20)
          surfaces = {name: fetch(name, path) for name, path in endpoints.items()}

          def payload(name):
              value = surfaces.get(name, {})
              data = value.get("json") if isinstance(value, dict) else None
              return data if isinstance(data, dict) else {}

          health = payload("health")
          e2e = payload("e2e-status")
          composition = payload("production-composition")
          proof = payload("production-proof")
          continuity = payload("batch9-continuity")

          release_candidates = []
          for source_name, source in (("health", health), ("e2e", e2e), ("proof", proof)):
              release = source.get("release") if isinstance(source, dict) else None
              if isinstance(release, dict):
                  commit = release.get("release_commit") or release.get("commit")
                  if commit:
                      release_candidates.append({"source": source_name, "release_commit": commit})
              direct = source.get("release_commit") if isinstance(source, dict) else None
              if direct:
                  release_candidates.append({"source": source_name, "release_commit": direct})

          summary = {
              "observer_version": "live-production-certification-observer-v3-current-release",
              "read_only": True,
              "expected_release": expected,
              "observed_release_candidates": release_candidates,
              "http": {
                  name: {
                      "status": value.get("http_status"),
                      "latency_ms": value.get("latency_ms"),
                      "error": value.get("error"),
                      "json_error": value.get("json_error"),
                  }
                  for name, value in surfaces.items()
              },
              "health": health,
              "e2e_status": e2e,
              "production_composition": composition,
              "production_proof": proof,
              "batch9_continuity": continuity,
              "e2e_status_cache": payload("e2e-status-cache"),
              "production_proof_cache": payload("production-proof-cache"),
          }
          (out / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )

          print("LIVE_CERTIFICATION_OBSERVER_BEGIN")
          print(json.dumps({
              "expected_release": expected,
              "observed_release_candidates": release_candidates,
              "http": summary["http"],
              "solana": e2e.get("solana"),
              "fomo": e2e.get("fomo"),
              "robinhood": e2e.get("robinhood"),
              "composition_health_semantics": composition.get("health_semantics"),
              "paper_execution_lifecycle": composition.get("paper_execution_lifecycle"),
              "proof_state": proof.get("state"),
              "proof_blockers": proof.get("blockers"),
              "resource_pressure": proof.get("resource_pressure"),
          }, indent=2, sort_keys=True))
          print("LIVE_CERTIFICATION_OBSERVER_END")

          observed_commits = {item["release_commit"] for item in release_candidates}
          mismatches = sorted(commit for commit in observed_commits if commit != expected)
          if mismatches:
              raise SystemExit(f"live release mismatch: {mismatches} != {expected}")
          if not observed_commits:
              raise SystemExit("no live release commit observed")
          PY

      - name: Upload exact live observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-certification-observer
          path: observer-output/
          if-no-files-found: error
          retention-days: 7
