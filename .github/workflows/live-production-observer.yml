name: Live Production Certification Observer

on:
  push:
    branches:
      - certification/live-production-observer-fb660df

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact live production release
        env:
          BASE_URL: https://solana-roi-convergence.onrender.com
          EXPECTED_RELEASE: c9a55e021a6693baf42465303f6ed10918c3cff8
          EXPECTED_RPC_OWNERSHIP_VERSION: rpc-endpoint-task-terminal-ownership-v3-captured-capacity-reference
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_RELEASE"]
          expected_rpc_version = os.environ["EXPECTED_RPC_OWNERSHIP_VERSION"]
          out = pathlib.Path("observer-output")
          out.mkdir(parents=True, exist_ok=True)
          endpoints = {
              "health": "/health",
              "e2e-status": "/v1/strategy/e2e-status",
              "production-composition": "/v1/operations/production-composition",
              "production-proof": "/v1/strategy/production-proof",
              "batch9-continuity": "/v1/strategy/batch9-continuity",
          }

          def fetch(name, path):
              result = {"name": name, "path": path}
              body = b""
              try:
                  req = urllib.request.Request(base + path, headers={"User-Agent": "solana-roi-certification-observer/10"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result["http_status"] = response.status
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  result["http_status"] = exc.code
                  result["error"] = f"HTTPError:{exc.code}"
                  body = exc.read()
              except Exception as exc:
                  result["error"] = f"{type(exc).__name__}:{exc}"
              text = body.decode("utf-8", errors="replace")
              try:
                  result["json"] = json.loads(text) if text else None
              except Exception as exc:
                  result["json"] = None
                  result["json_error"] = f"{type(exc).__name__}:{exc}"
              (out / f"{name}.json").write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
              return result

          surfaces = {name: fetch(name, path) for name, path in endpoints.items()}
          def payload(name):
              value = surfaces[name].get("json")
              return value if isinstance(value, dict) else {}

          health = payload("health")
          e2e = payload("e2e-status")
          proof = payload("production-proof")
          composition = payload("production-composition")
          releases = []
          for value in (health.get("release_commit"), e2e.get("release_commit")):
              if value: releases.append(str(value))
          proof_release = proof.get("release")
          if isinstance(proof_release, dict) and proof_release.get("release_commit"):
              releases.append(str(proof_release["release_commit"]))

          ownership = composition.get("rpc_task_ownership") or {}
          summary = {
              "observer_version": "live-production-certification-observer-v6-cgroup-forensics",
              "read_only": True,
              "expected_release": expected,
              "observed_releases": releases,
              "release_exact": bool(releases) and all(value == expected for value in releases),
              "rpc_task_ownership_repair_version": composition.get("rpc_task_ownership_repair_version"),
              "rpc_task_ownership": ownership,
              "runtime_memory_capacity": composition.get("runtime_memory_capacity"),
              "http": {name: {k: value.get(k) for k in ("http_status", "error", "json_error")} for name, value in surfaces.items()},
              "e2e_state": e2e.get("overall"),
              "solana": e2e.get("solana"),
              "fomo": e2e.get("fomo"),
              "robinhood": e2e.get("robinhood"),
              "proof_state": proof.get("state"),
              "proof_blockers": proof.get("blockers"),
              "batch9_continuity": payload("batch9-continuity"),
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8")
          print("LIVE_CERTIFICATION_OBSERVER_BEGIN")
          print(json.dumps(summary, indent=2, sort_keys=True))
          print("LIVE_CERTIFICATION_OBSERVER_END")

          blockers = []
          if not summary["release_exact"]: blockers.append("live_release_mismatch")
          if composition.get("rpc_task_ownership_repair_version") != expected_rpc_version: blockers.append("rpc_task_ownership_version_mismatch")
          if ownership.get("installed") is not True: blockers.append("rpc_task_ownership_not_installed")
          if ownership.get("preowned_capacity_module_captures_rebound") is not True: blockers.append("captured_capacity_rebind_capability_not_live")
          if int(ownership.get("captured_capacity_references_rebound", 0) or 0) < 1: blockers.append("captured_capacity_reference_not_rebound")
          if blockers:
              raise SystemExit("observer blockers: " + ",".join(blockers))
          PY

      - name: Upload exact live observer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-certification-observer
          path: observer-output/
          if-no-files-found: error
          retention-days: 7