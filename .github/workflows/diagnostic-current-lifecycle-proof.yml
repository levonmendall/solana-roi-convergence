name: Diagnostic Current Lifecycle Proof

on:
  push:
    branches:
      - diagnostic/current-lifecycle-proof-20260907

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-result]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact live continuity and lifecycle blockers
        env:
          BASE_URL: https://solana-roi-convergence.onrender.com
          EXPECTED_SHA: ceb6f7743c7f9d4ac72bbd3a8c95bbe78a8cb579
        run: |
          mkdir -p diagnostics
          python - <<'PY' | tee diagnostics/current-lifecycle-proof.txt
          import json, os, urllib.request
          base=os.environ['BASE_URL'].rstrip('/')
          expected=os.environ['EXPECTED_SHA']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/json','User-Agent':'solana-roi-continuity-diagnostic/1'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read().decode())
          e2e=get('/v1/strategy/e2e-status')
          assert e2e.get('release_commit')==expected,(e2e.get('release_commit'),expected)
          sol=e2e.get('solana') or {}
          fomo=e2e.get('fomo') or {}
          td=sol.get('transport_diagnostics') or {}
          out={
              'release_commit':e2e.get('release_commit'),
              'solana_runtime_ready':sol.get('runtime_ready'),
              'solana_blockers':sol.get('blockers'),
              'fomo_runtime_ready':fomo.get('runtime_ready'),
              'fomo_blockers':fomo.get('blockers'),
              'strategy_relevant_continuity':td.get('strategy_relevant_continuity'),
              'release_continuity_epoch':td.get('release_continuity_epoch'),
              'direct_solana':td.get('direct_solana'),
              'read_boundary':e2e.get('read_boundary'),
          }
          print(json.dumps(out,sort_keys=True,indent=2,default=str))
          PY
      - name: Persist diagnostic result on diagnostic branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/current-lifecycle-proof.txt
          git commit -m '[diagnostic-result] persist continuity blocker proof' || exit 0
          git push
