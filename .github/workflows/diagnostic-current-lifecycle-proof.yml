name: Diagnostic Current Lifecycle Proof

on:
  push:
    branches:
      - diagnostic/current-lifecycle-proof-20260907

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact live lifecycle truth
        env:
          BASE_URL: https://solana-roi-convergence.onrender.com
          EXPECTED_SHA: ceb6f7743c7f9d4ac72bbd3a8c95bbe78a8cb579
        run: |
          python - <<'PY' | tee /tmp/lifecycle-proof.txt
          import json, os, urllib.request

          base = os.environ['BASE_URL'].rstrip('/')
          expected = os.environ['EXPECTED_SHA']
          paths = [
              '/health',
              '/v1/strategy/e2e-status',
              '/v1/strategy/forward-certification',
              '/v1/strategy/production-proof',
          ]

          def get(path):
              req = urllib.request.Request(base + path, headers={'Accept':'application/json','User-Agent':'solana-roi-lifecycle-diagnostic/2'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.loads(r.read().decode())

          def collect(obj, path='$', out=None):
              if out is None: out=[]
              if isinstance(obj, dict):
                  interesting = {
                      'paper_execution_lifecycle','lifecycle_proven','worker_running','worker_healthy',
                      'last_tick_at','last_error','tick_count','retry_tick_count','reservation_sync_count',
                      'settlement_sync_count','open_position_count','open_positions_by_lane',
                      'lifecycle_event_counts','capital_reconciliation','settlement_count','realized_pnl',
                      'realized_pnl_sol','realized_return','paper_only','live_money_authority',
                      'signing_available','transaction_submission_available','release_commit'
                  }
                  for k,v in obj.items():
                      p=f'{path}.{k}'
                      if k in interesting:
                          out.append((p,v))
                      collect(v,p,out)
              elif isinstance(obj, list):
                  for i,v in enumerate(obj): collect(v,f'{path}[{i}]',out)
              return out

          payloads={}
          for path in paths:
              try:
                  payloads[path]=get(path)
                  print(f'FETCH_OK {path}')
              except Exception as exc:
                  print(f'FETCH_ERROR {path} {type(exc).__name__}: {exc}')

          releases=[]
          for path,p in payloads.items():
              if isinstance(p,dict):
                  if p.get('release_commit'): releases.append((path,p.get('release_commit')))
                  rel=p.get('release')
                  if isinstance(rel,dict) and rel.get('release_commit'): releases.append((path,rel.get('release_commit')))
          print('EXPECTED_SHA', expected)
          print('RELEASES', json.dumps(releases, sort_keys=True))

          for path,p in payloads.items():
              print('===',path,'===')
              for key,val in collect(p):
                  print(key, '=', json.dumps(val, sort_keys=True, default=str))

          for path,p in payloads.items():
              if isinstance(p,dict): print('TOP_KEYS', path, sorted(p.keys()))

          assert any(str(v)==expected for _,v in releases), f'live release does not expose expected SHA {expected}'
          PY
          {
            echo '## Current live lifecycle proof';
            echo '```text';
            cat /tmp/lifecycle-proof.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
