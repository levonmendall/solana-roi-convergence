name: ASGI Bootstrap Memory Regression

on:
  push:
    branches:
      - diagnostic/asgi-bootstrap-memory-retention-runner

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Use current diagnostic PR test
        run: |
          git fetch origin diagnostic/asgi-bootstrap-memory-retention --depth=1
          git checkout FETCH_HEAD -- tests/test_certification_logical_bootstrap_asgi_memory_retention.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Run isolated ASGI memory regression and capture diagnostic
        run: |
          set +e
          python -m pytest -s -vv tests/test_certification_logical_bootstrap_asgi_memory_retention.py > asgi-bootstrap-memory-regression.log 2>&1
          status=$?
          printf '%s\n' "$status" > pytest-status.txt
          grep -E 'ASGI_BOOTSTRAP_MEMORY_TRACE|AssertionError|logical-bootstrap cleanup|reason|FAILED|assert retention_proofs|assert release_proofs|assert not lifecycle_failures' asgi-bootstrap-memory-regression.log | tail -n 80 > diagnostic.txt || true
          cat diagnostic.txt
          exit 0
      - name: Publish diagnostic to draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Isolated ASGI bootstrap memory regression diagnostic from runner commit `${{ github.sha }}` using current PR #366 test:'
            echo
            echo '```text'
            cat diagnostic.txt
            echo '```'
          } > diagnostic-comment.md
          gh pr comment 366 --body-file diagnostic-comment.md
      - name: Preserve regression result
        if: always()
        run: test "$(cat pytest-status.txt)" -eq 0
