name: Exact Live Certification Diagnostic

on:
  push:
    branches:
      - diagnostic/live-cert-3e18f4e

permissions:
  contents: read

jobs:
  exact-live-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print certifier health and safe exact-live evidence
        env:
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          SOLANA_ROI_CERTIFIER_PUBLIC_URL: https://solana-roi-certifier.onrender.com
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          def get(base, path):
              req = urllib.request.Request(base.rstrip('/') + path, headers={'Accept':'application/json','User-Agent':'solana-roi-live-evidence-ci/2'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          runtime = os.environ['SOLANA_ROI_PRODUCTION_URL']
          certifier = os.environ['SOLANA_ROI_CERTIFIER_PUBLIC_URL']
          health = get(certifier, '/health')
          e2e = get(runtime, '/v1/strategy/e2e-status')
          forward = get(runtime, '/v1/strategy/forward-certification')
          production = get(runtime, '/v1/strategy/production-proof')
          accounting = production.get('candidate_accounting') or {}
          lanes = accounting.get('lanes') or accounting.get('lane_accounting') or {}
          conservation = accounting.get('candidate_conservation') or {}
          checks = forward.get('checks') or {}

          summary = {
              'certifier_health': health,
              'e2e': {
                  'release_commit': e2e.get('release_commit'),
                  'overall': e2e.get('overall'),
                  'certification_service_split': e2e.get('certification_service_split'),
                  'isolated_certifier': e2e.get('isolated_certifier'),
              },
              'forward': {
                  'release_commit': forward.get('release_commit'),
                  'state': forward.get('state'),
                  'system_forward_certified': forward.get('system_forward_certified'),
                  'blockers': forward.get('blockers'),
                  'checks_35_39': {k:v for k,v in checks.items() if k.startswith(('35_','36_','37_','38_','39_'))},
                  'certification_service_split': forward.get('certification_service_split'),
                  'isolated_certifier': forward.get('isolated_certifier'),
              },
              'production': {
                  'release': production.get('release'),
                  'state': production.get('state'),
                  'production_proof_pass': production.get('production_proof_pass'),
                  'blockers': production.get('blockers'),
                  'final_certification': production.get('final_certification'),
                  'lanes': {k: lanes.get(k) for k in ('pump_fun','pump_amm','raydium','fomo','robinhood')},
                  'candidate_conservation': conservation,
                  'certification_service_split': production.get('certification_service_split'),
                  'isolated_certifier': production.get('isolated_certifier'),
              },
          }
          print(json.dumps(summary, sort_keys=True))
          PY
