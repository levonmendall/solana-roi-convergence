name: v5.2 historical replay implementation trace

on:
  push:
    branches:
      - analysis/v52-historical-replay-20260914
    paths:
      - .github/workflows/v52_historical_readonly_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trace replay implementations and entry points
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics/v52_historical_replay/output
          {
            echo '=== HISTORICAL REPLAY REFERENCES ==='
            grep -Rni -B12 -A35 -E 'historical_swap_replay|historical swap replay|historical_replay|replay_historical|backtest|retrospective' src operations tests 2>/dev/null | head -n 12000 || true
            echo '=== ROBINHOOD RETURN RESOLUTION ==='
            grep -Rni -B15 -A70 -E '_resolve_robinhood_forward_market_returns|forward_market_returns|price_eth,observed_at.*robinhood_swaps' src/solana_roi 2>/dev/null | head -n 8000 || true
            echo '=== SOLANA PRICE PATH / COUNTERFACTUAL ==='
            grep -Rni -B15 -A70 -E 'normalized_swaps.*reference_price_sol|reference_price_sol.*normalized_swaps|counterfactual.*normalized_swaps|MFE|MAE' src/solana_roi 2>/dev/null | head -n 10000 || true
          } > diagnostics/v52_historical_replay/output/replay_trace.txt
          cat diagnostics/v52_historical_replay/output/replay_trace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v52-historical-replay-implementation-trace
          path: diagnostics/v52_historical_replay/output/replay_trace.txt
          retention-days: 7
