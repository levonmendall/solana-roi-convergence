name: v5.2 ten-day economic evidence probe

on:
  push:
    branches:
      - analysis/v52-historical-replay-20260914
    paths:
      - .github/workflows/v52_historical_readonly_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public economic evidence surfaces
        shell: python
        run: |
          import json, urllib.request, urllib.error
          from pathlib import Path
          out=Path('diagnostics/v52_historical_replay/output'); out.mkdir(parents=True,exist_ok=True)
          base='https://solana-roi-convergence.onrender.com'
          paths=[
            '/v1/strategy/rejected-counterfactuals',
            '/v1/strategy/execution-cost-ledger',
            '/v1/strategy/forward-certification',
            '/v1/strategy/research-allocation',
            '/v1/certification/profitability',
            '/v1/strategy/e2e-status',
            '/v1/strategy/economic-certification',
            '/v1/strategy/final-certification',
            '/v1/strategy/portfolio-reconciliation',
            '/v1/strategy/promotion-certification',
            '/v1/strategy/incremental-alpha',
            '/v1/strategy/hazard-calibration',
            '/v1/strategy/execution-stress',
            '/v1/strategy/allocation-maturity',
            '/v1/strategy/alpha-certificate',
            '/v1/strategy/v52',
            '/v1/strategy/v52/performance/24h',
            '/v1/strategy/v52/performance/7d',
            '/v1/strategy/v52/wallet-forward-alpha',
            '/v1/strategy/candidate-coverage',
            '/v1/robinhood-chain/status',
          ]
          summary=[]
          for path in paths:
            name=path.strip('/').replace('/','_')+'.json'
            try:
              req=urllib.request.Request(base+path,headers={'user-agent':'v52-ten-day-readonly-replay'})
              with urllib.request.urlopen(req,timeout=90) as r:
                body=r.read(10_000_000)
                status=r.status
              (out/name).write_bytes(body)
              try:
                data=json.loads(body)
                info={'path':path,'status':status,'bytes':len(body),'keys':list(data)[:100] if isinstance(data,dict) else None,'type':type(data).__name__}
              except Exception as e:
                info={'path':path,'status':status,'bytes':len(body),'parse_error':type(e).__name__}
              summary.append(info)
              print(json.dumps(info,sort_keys=True))
            except Exception as e:
              info={'path':path,'error':repr(e)}; summary.append(info); print(json.dumps(info,sort_keys=True))
          (out/'surface_summary.json').write_text(json.dumps(summary,indent=2))
      - name: Trace source implementations of useful surfaces
        shell: bash
        run: |
          set -u
          grep -RniE 'rejected.counterfactual|execution.cost.ledger|def .*forward.*cert|def .*profitability|incremental.alpha|hazard.calibration|allocation.maturity|alpha.certificate|portfolio.reconciliation' src/solana_roi 2>/dev/null | head -n 8000 > diagnostics/v52_historical_replay/output/economic_surface_source_trace.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: v52-ten-day-economic-evidence
          path: diagnostics/v52_historical_replay/output
          retention-days: 7
