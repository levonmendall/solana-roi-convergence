name: v5.2 historical event emitter trace

on:
  push:
    branches:
      - analysis/v52-historical-replay-20260914
    paths:
      - .github/workflows/v52_historical_readonly_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Locate event log emitters and historical table schemas
        shell: bash
        run: |
          set -u
          mkdir -p diagnostics/v52_historical_replay/output
          {
            echo '=== LOG EMITTERS ==='
            grep -RniE '(print|logger\.|logging\.).*(SOLANA_ROI|candidate|trial|outcome|fomo|robinhood|wallet|swap|qualification|entry|exit)' src operations 2>/dev/null | head -n 12000 || true
            echo '=== TABLE DDL / INSERT / SELECT ==='
            grep -RniE '(CREATE TABLE|INSERT INTO|SELECT .* FROM|UPDATE ).*(normalized_swaps|v51_candidates|candidate_stage_events|fomo_paper|robinhood_(launches|swaps|paper_trials|paper_outcomes)|wallet)' src operations 2>/dev/null | head -n 12000 || true
            echo '=== EVENT TYPES ==='
            grep -RhoE "['\"][A-Za-z0-9_.:-]*(candidate|trial|outcome|entry|exit|fomo|robinhood|wallet|swap)[A-Za-z0-9_.:-]*['\"]" src/solana_roi 2>/dev/null | sort -u | head -n 5000 || true
          } > diagnostics/v52_historical_replay/output/emitter_trace.txt
          cat diagnostics/v52_historical_replay/output/emitter_trace.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v52-historical-event-emitter-trace
          path: diagnostics/v52_historical_replay/output/emitter_trace.txt
          retention-days: 7
