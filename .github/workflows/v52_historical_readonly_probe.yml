name: v5.2 historical provider probe

on:
  push:
    branches:
      - analysis/v52-historical-replay-20260914
    paths:
      - .github/workflows/v52_historical_readonly_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      SOLANA_ROI_ALCHEMY_API_KEY: ${{ secrets.SOLANA_ROI_ALCHEMY_API_KEY }}
      SOLANA_ROI_DRPC_API_KEY: ${{ secrets.SOLANA_ROI_DRPC_API_KEY }}
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
      ROBINHOOD_BACKUP_RPC_URL: ${{ secrets.ROBINHOOD_BACKUP_RPC_URL }}
      ROBINHOOD_VALIDATION_CLOUD_RPC_URL: ${{ secrets.ROBINHOOD_VALIDATION_CLOUD_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check provider availability without exposing credentials
        shell: python
        run: |
          import json, os, urllib.request
          from pathlib import Path
          out=Path('diagnostics/v52_historical_replay/output'); out.mkdir(parents=True,exist_ok=True)
          names=['HELIUS_API_KEY','SOLANA_ROI_ALCHEMY_API_KEY','SOLANA_ROI_DRPC_API_KEY','ROBINHOOD_RPC_URL','ROBINHOOD_BACKUP_RPC_URL','ROBINHOOD_VALIDATION_CLOUD_RPC_URL']
          result={'configured':{n:bool(os.getenv(n)) for n in names}}
          def rpc(url,method,params):
            body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
            req=urllib.request.Request(url,data=body,headers={'content-type':'application/json','user-agent':'v52-readonly-historical-probe'})
            try:
              with urllib.request.urlopen(req,timeout=15) as r:
                data=json.loads(r.read())
              return {'ok': 'result' in data, 'error': data.get('error'), 'result_type': type(data.get('result')).__name__}
            except Exception as e:
              return {'ok':False,'error_type':type(e).__name__,'error_text':str(e)[:160]}
          hk=os.getenv('HELIUS_API_KEY','')
          if hk:
            result['helius_rpc']=rpc(f'https://mainnet.helius-rpc.com/?api-key={hk}','getSlot',[{'commitment':'finalized'}])
          for key in ['ROBINHOOD_RPC_URL','ROBINHOOD_BACKUP_RPC_URL','ROBINHOOD_VALIDATION_CLOUD_RPC_URL']:
            url=os.getenv(key,'').strip()
            if url:
              result[key+'_probe']=rpc(url,'eth_chainId',[])
          (out/'provider_probe.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,indent=2,sort_keys=True))
      - uses: actions/upload-artifact@v4
        with:
          name: v52-historical-provider-probe
          path: diagnostics/v52_historical_replay/output/provider_probe.json
          retention-days: 7
