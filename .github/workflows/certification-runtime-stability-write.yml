name: Certification Runtime Stability Writer

on:
  push:
    branches:
      - repair/certification-runtime-stability
    paths:
      - .github/workflows/certification-runtime-stability-write.yml

permissions:
  contents: write

jobs:
  write-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/certification-runtime-stability
          fetch-depth: 0
      - name: Apply targeted certification repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          # 1) Own terminal failures at the actual production-capacity coroutine root.
          p = Path('src/solana_roi/production_capacity_repair.py')
          text = p.read_text()
          marker = '_ROI_CAPACITY_TASK_OWNERSHIP_VERSION = "capacity-endpoint-root-terminal-ownership-v1"'
          if marker not in text:
              anchor = '_ACTIVE_DIRECT_PLANE: weakref.ReferenceType[Any] | None = None\n'
              insert = '''_ACTIVE_DIRECT_PLANE: weakref.ReferenceType[Any] | None = None

_ROI_CAPACITY_TASK_OWNERSHIP_VERSION = "capacity-endpoint-root-terminal-ownership-v1"
_ROI_CAPACITY_TASK_OWNERSHIP = {
    "owned_tasks": 0,
    "terminal_successes": 0,
    "terminal_failures": 0,
    "terminal_cancellations": 0,
}


def _observe_capacity_endpoint_terminal_state(task: asyncio.Task[Any]) -> None:
    try:
        exc = task.exception()
    except asyncio.CancelledError:
        _ROI_CAPACITY_TASK_OWNERSHIP["terminal_cancellations"] += 1
        return
    except BaseException:
        _ROI_CAPACITY_TASK_OWNERSHIP["terminal_failures"] += 1
        return
    if exc is None:
        _ROI_CAPACITY_TASK_OWNERSHIP["terminal_successes"] += 1
    else:
        _ROI_CAPACITY_TASK_OWNERSHIP["terminal_failures"] += 1


def _own_capacity_endpoint_task() -> None:
    task = asyncio.current_task()
    if task is None:
        return
    try:
        root_code = getattr(task.get_coro(), "cr_code", None)
    except BaseException:
        return
    if root_code is not _capacity_call_endpoint.__code__:
        return
    if bool(getattr(task, "_roi_capacity_endpoint_terminal_observer", False)):
        return
    setattr(task, "_roi_capacity_endpoint_terminal_observer", True)
    task.add_done_callback(_observe_capacity_endpoint_terminal_state)
    _ROI_CAPACITY_TASK_OWNERSHIP["owned_tasks"] += 1
'''
              if anchor not in text:
                  raise SystemExit('production_capacity_repair.py: ownership anchor missing')
              text = text.replace(anchor, insert, 1)
              sig = '''async def _capacity_call_endpoint(
    self: SolanaRpcPool,
    endpoint: RpcEndpoint,
    method: str,
    params: list[Any],
) -> tuple[Any, str, float]:
    remaining = _cooldown_remaining(self, endpoint)
'''
              sig_new = '''async def _capacity_call_endpoint(
    self: SolanaRpcPool,
    endpoint: RpcEndpoint,
    method: str,
    params: list[Any],
) -> tuple[Any, str, float]:
    _own_capacity_endpoint_task()
    remaining = _cooldown_remaining(self, endpoint)
'''
              if sig not in text:
                  raise SystemExit('production_capacity_repair.py: endpoint signature anchor missing')
              text = text.replace(sig, sig_new, 1)
              status_anchor = '''        "read_only": True,
    }
    return payload
'''
              status_new = '''        "read_only": True,
        "endpoint_task_terminal_ownership": {
            "version": _ROI_CAPACITY_TASK_OWNERSHIP_VERSION,
            **dict(_ROI_CAPACITY_TASK_OWNERSHIP),
            "root_coroutine": "_capacity_call_endpoint",
            "failure_semantics_changed": False,
        },
    }
    return payload
'''
              if status_anchor not in text:
                  raise SystemExit('production_capacity_repair.py: status anchor missing')
              text = text.replace(status_anchor, status_new, 1)
              p.write_text(text)

          # 2) Stop unchanged evidence rows from dirtying SQLite/WAL every proof refresh.
          p = Path('src/solana_roi/v51_evidence_analytics.py')
          text = p.read_text()
          cost_old = '''                "normalized_at=excluded.normalized_at,paper_only=1,live_money_authority=0",
'''
          cost_new = '''                "normalized_at=excluded.normalized_at,paper_only=1,live_money_authority=0 "
                "WHERE v51_execution_cost_ledger.family IS NOT excluded.family "
                "OR v51_execution_cost_ledger.release_commit IS NOT excluded.release_commit "
                "OR v51_execution_cost_ledger.token_mint IS NOT excluded.token_mint "
                "OR v51_execution_cost_ledger.round_trip_cost_fraction IS NOT excluded.round_trip_cost_fraction "
                "OR v51_execution_cost_ledger.cost_source IS NOT excluded.cost_source "
                "OR v51_execution_cost_ledger.paper_only IS NOT 1 "
                "OR v51_execution_cost_ledger.live_money_authority IS NOT 0",
'''
          if cost_old not in text and cost_new not in text:
              raise SystemExit('v51_evidence_analytics.py: cost UPSERT anchor missing')
          text = text.replace(cost_old, cost_new, 1)

          cf_old = '''                "updated_at=excluded.updated_at,retrospective_entry_authority=0,paper_only=1,live_money_authority=0",
'''
          cf_new = '''                "updated_at=excluded.updated_at,retrospective_entry_authority=0,paper_only=1,live_money_authority=0 "
                "WHERE v51_rejected_counterfactuals.release_commit IS NOT excluded.release_commit "
                "OR v51_rejected_counterfactuals.token_mint IS NOT excluded.token_mint "
                "OR v51_rejected_counterfactuals.decision_reason IS NOT excluded.decision_reason "
                "OR v51_rejected_counterfactuals.decision_observed_at IS NOT excluded.decision_observed_at "
                "OR v51_rejected_counterfactuals.forward_net_return IS NOT excluded.forward_net_return "
                "OR v51_rejected_counterfactuals.resolution_source IS NOT excluded.resolution_source "
                "OR v51_rejected_counterfactuals.counterfactual_state IS NOT excluded.counterfactual_state "
                "OR v51_rejected_counterfactuals.hazard_signature IS NOT excluded.hazard_signature "
                "OR v51_rejected_counterfactuals.hazard_severity IS NOT excluded.hazard_severity "
                "OR v51_rejected_counterfactuals.payload_json IS NOT excluded.payload_json "
                "OR v51_rejected_counterfactuals.retrospective_entry_authority IS NOT 0 "
                "OR v51_rejected_counterfactuals.paper_only IS NOT 1 "
                "OR v51_rejected_counterfactuals.live_money_authority IS NOT 0",
'''
          if cf_old not in text and cf_new not in text:
              raise SystemExit('v51_evidence_analytics.py: counterfactual UPSERT anchor missing')
          text = text.replace(cf_old, cf_new, 1)
          p.write_text(text)

          # 3) Forward-certification GET must consume the already-published proof snapshot, never rebuild/write evidence.
          p = Path('src/solana_roi/v51_forward_certification.py')
          text = p.read_text()
          old = '''            runtime = runtime_provider()
            expected_release = os.getenv("RENDER_GIT_COMMIT", "").strip() or None
            proof, proof_state = _cached_robinhood_proof(robinhood_status_provider)
            return build_forward_certification(
                runtime.store,
                unified_status=_e2e_status(app),
                expected_release_commit=expected_release,
                robinhood_proof=proof,
                robinhood_proof_state=proof_state,
            )
'''
          new = '''            # Certification GET is a pure read boundary. The authoritative recurring
            # production-proof publisher owns deep evidence materialization and stale
            # semantics; HTTP traffic must not refresh attestations or dirty SQLite.
            from . import production_proof_read_boundary_repair as proof_boundary

            cached = proof_boundary._cached_production_proof()
            forward = cached.get("forward_certification") if isinstance(cached, dict) else None
            if isinstance(forward, dict) and forward:
                import copy

                payload = copy.deepcopy(forward)
                payload["read_boundary"] = {
                    "source": "production_proof_snapshot",
                    "http_request_executes_evidence_materialization": False,
                    "paper_only": True,
                    "live_money_authority": False,
                }
                return payload
            return {
                "certification_version": CERTIFICATION_VERSION,
                "system_forward_certified": False,
                "state": "UNPROVEN_CERTIFICATION_EVIDENCE_INSUFFICIENT",
                "blockers": ["production_proof_snapshot_not_ready_or_stale"],
                "read_boundary": {
                    "source": "production_proof_snapshot",
                    "http_request_executes_evidence_materialization": False,
                },
                "changes_strategy_authority": False,
                "changes_economic_thresholds": False,
                "paper_only": True,
                "live_money_authority": False,
                "signing_available": False,
                "transaction_submission_available": False,
            }
'''
          if old not in text and new not in text:
              raise SystemExit('v51_forward_certification.py: endpoint anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Focused regression source checks. Existing broad suite remains authoritative in PR CI.
          Path('tests/test_certification_runtime_stability_repair.py').write_text(r'''from __future__ import annotations

import asyncio
import inspect

from solana_roi import production_capacity_repair as capacity
from solana_roi import v51_forward_certification as forward
from solana_roi import v51_evidence_analytics as analytics


def test_forward_certification_get_is_snapshot_read_only() -> None:
    source = inspect.getsource(forward.install_forward_certification)
    assert "_cached_production_proof" in source
    assert "http_request_executes_evidence_materialization" in source
    endpoint_body = source.split("def forward_certification_status", 1)[1]
    assert "build_forward_certification(" not in endpoint_body.split("app.add_api_route", 1)[0]


def test_high_volume_upserts_skip_unchanged_rows() -> None:
    cost = inspect.getsource(analytics.refresh_execution_cost_ledger)
    rejected = inspect.getsource(analytics.refresh_rejected_counterfactuals)
    assert "WHERE v51_execution_cost_ledger.family IS NOT excluded.family" in cost
    assert "WHERE v51_rejected_counterfactuals.release_commit IS NOT excluded.release_commit" in rejected
    assert "live_money_authority IS NOT 0" in cost
    assert "live_money_authority IS NOT 0" in rejected


def test_capacity_endpoint_root_owns_terminal_failure_without_changing_await_semantics() -> None:
    source = inspect.getsource(capacity._capacity_call_endpoint)
    assert "_own_capacity_endpoint_task()" in source
    assert capacity._ROI_CAPACITY_TASK_OWNERSHIP_VERSION == "capacity-endpoint-root-terminal-ownership-v1"
    assert capacity._ROI_CAPACITY_TASK_OWNERSHIP["owned_tasks"] >= 0


def test_repair_preserves_paper_only_authority() -> None:
    assert "paper_only" in inspect.getsource(capacity._capacity_status)
    assert "live_money_authority" in inspect.getsource(capacity._capacity_status)
''')
          PY
      - name: Syntax and focused regression
        run: |
          python -m compileall -q src/solana_roi
          python -m pytest -q tests/test_certification_runtime_stability_repair.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/solana_roi/production_capacity_repair.py src/solana_roi/v51_evidence_analytics.py src/solana_roi/v51_forward_certification.py tests/test_certification_runtime_stability_repair.py
          git diff --cached --check
          git commit -m "Repair certification read writes and RPC task ownership"
          git push origin HEAD:repair/certification-runtime-stability
