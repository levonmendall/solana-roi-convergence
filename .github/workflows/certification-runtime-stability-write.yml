name: Certification Runtime Stability Writer

on:
  push:
    branches: ["repair/certification-runtime-stability"]
    paths:
      - "scripts/apply_certification_runtime_stability_repair.py"
      - ".github/workflows/certification-runtime-stability-write.yml"

permissions:
  contents: write

jobs:
  write-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/certification-runtime-stability
          fetch-depth: 0
      - name: Apply repair
        run: python scripts/apply_certification_runtime_stability_repair.py
      - name: Syntax and focused regression
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/solana_roi
          python -m pytest -q tests/test_certification_runtime_stability_repair.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/solana_roi/production_capacity_repair.py src/solana_roi/v51_evidence_analytics.py src/solana_roi/v51_forward_certification.py tests/test_certification_runtime_stability_repair.py
          git diff --cached --check
          git commit -m "Repair certification read writes and RPC task ownership"
          git push origin HEAD:repair/certification-runtime-stability
