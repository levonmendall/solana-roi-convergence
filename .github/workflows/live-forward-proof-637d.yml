name: Live Forward Proof 637d

on:
  push:
    branches: [verify/live-forward-proof-637d]

permissions:
  contents: read

concurrency:
  group: live-forward-proof-637d
  cancel-in-progress: true

jobs:
  diagnose-live-main:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Robinhood forward throughput
        run: |
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://solana-roi-convergence.onrender.com/v1/strategy/e2e-status',headers={'Accept':'application/json','User-Agent':'roi-rh-throughput/1'})
          with urllib.request.urlopen(req,timeout=60) as r:
              e=json.loads(r.read().decode())
          rh=e.get('robinhood') or {}
          keys=['release_commit','runtime_ready','paper_decision_transport_ready','forward_frontier_ready','tracked_v3_pools','tracked_pons_v2_curves','latest_block','block_lag','last_poll_at','last_success_at','rpc_failures','last_error']
          out={k:rh.get(k) for k in keys}
          for k in ['forward_frontier_readiness','live_frontier_verification','forward_only_runtime','catchup_capacity','post177_forward_pipeline_bottleneck_repair','worker_isolation','rpc_scheduler','provider_scheduler','rwa_filter']:
              if k in rh: out[k]=rh.get(k)
          print('ROBINHOOD_THROUGHPUT',json.dumps(out,sort_keys=True,default=str))
          PY
