name: Live Read-Only Certification Probe

on:
  push:
    branches: [certification/live-355b4f-readonly]

permissions:
  contents: read

concurrency:
  group: live-readonly-certification-355b4f
  cancel-in-progress: true

jobs:
  exact-release-forward-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact live release and paper transports
        env:
          EXPECTED_RELEASE_COMMIT: 355b4f0100e69e6d3c7a1e540617c8bb8d66816c
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          FORWARD_PROOF_PROBE_ATTEMPTS: '1'
          FORWARD_PROOF_PROBE_SLEEP_SECONDS: '10'
          FORWARD_PROOF_HTTP_TIMEOUT_SECONDS: '60'
          PYTHONUNBUFFERED: '1'
        run: python tests/production_forward_proof_probe.py
