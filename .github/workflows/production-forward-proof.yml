name: Live Read-Only Certification Sampler 30dfb817

on:
  push:
    branches: [certification/live-30dfb817-readonly]

permissions:
  contents: read

concurrency:
  group: live-readonly-certification-30dfb817
  cancel-in-progress: true

jobs:
  exact-release-forward-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample exact live release without triggering deep proof generation
        env:
          EXPECTED_RELEASE_COMMIT: 30dfb817bbe0075ac43a11b4a03c108a3536b7d0
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          LIVE_MEMORY_SAMPLES: '16'
          LIVE_MEMORY_SAMPLE_SECONDS: '5'
          LIVE_MEMORY_HTTP_TIMEOUT_SECONDS: '20'
          PYTHONUNBUFFERED: '1'
        run: python tests/production_forward_proof_probe.py
