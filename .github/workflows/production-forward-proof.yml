name: Live Read-Only Certification Sampler eadc6436

on:
  push:
    branches: [certification/live-eadc6436-readonly]

permissions:
  contents: read

concurrency:
  group: live-readonly-certification-eadc6436
  cancel-in-progress: true

jobs:
  exact-release-forward-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample exact live release without triggering deep proof generation
        env:
          EXPECTED_RELEASE_COMMIT: eadc6436c8ac9601603198cb2fd86c9b1c0dcc73
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          LIVE_MEMORY_SAMPLES: '16'
          LIVE_MEMORY_SAMPLE_SECONDS: '5'
          LIVE_MEMORY_HTTP_TIMEOUT_SECONDS: '20'
          PYTHONUNBUFFERED: '1'
        run: python tests/production_forward_proof_probe.py
