name: Live Read-Only Certification Sampler

on:
  push:
    branches: [certification/live-8c29d-readonly]

permissions:
  contents: read

concurrency:
  group: live-readonly-certification-8c29d
  cancel-in-progress: true

jobs:
  exact-release-forward-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample exact live release across publication cycles
        env:
          EXPECTED_RELEASE_COMMIT: 8c29d45202b3bb8bd218c883f227371842720f14
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          FORWARD_PROOF_HTTP_TIMEOUT_SECONDS: '45'
          PYTHONUNBUFFERED: '1'
        run: python tests/production_forward_proof_probe.py
