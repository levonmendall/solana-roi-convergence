name: Live Read-Only Memory Forensics

on:
  push:
    branches: [certification/live-4c4de036-readonly]

permissions:
  contents: read

concurrency:
  group: live-readonly-memory-4c4de036
  cancel-in-progress: true

jobs:
  live-memory-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe live cgroup without invoking deep builders
        env:
          EXPECTED_RELEASE_COMMIT: 4c4de03671999afc65d136f02f41ff2bdfb949c7
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          LIVE_MEMORY_SAMPLES: '32'
          LIVE_MEMORY_SAMPLE_SECONDS: '4'
          LIVE_MEMORY_HTTP_TIMEOUT_SECONDS: '20'
          PYTHONUNBUFFERED: '1'
        run: python tests/production_forward_proof_probe.py
