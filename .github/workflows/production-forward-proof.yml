name: Production Forward Proof

# This verifier is intentionally manual-only. Render is configured with
# autoDeployTrigger=checksPass, so a push-triggered workflow that waits for the
# new Render release would create a circular dependency: Render waits for this
# check while this check waits for Render. Run this only after the exact release
# is live (or while explicitly diagnosing a deployment).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-forward-proof
  cancel-in-progress: true

jobs:
  exact-release-forward-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact Render release and paper transports
        env:
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          FORWARD_PROOF_PROBE_ATTEMPTS: '30'
          FORWARD_PROOF_PROBE_SLEEP_SECONDS: '10'
          FORWARD_PROOF_HTTP_TIMEOUT_SECONDS: '60'
        run: python tests/production_forward_proof_probe.py
