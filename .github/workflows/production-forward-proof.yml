name: Live Read-Only Certification Sampler

on:
  push:
    branches: [certification/live-aefb1d-readonly]

permissions:
  contents: read

concurrency:
  group: live-readonly-certification-aefb1d
  cancel-in-progress: true

jobs:
  exact-release-forward-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample exact live release across publication cycles
        env:
          EXPECTED_RELEASE_COMMIT: aefb1dda9cd9aef19096945f6e47e1bc4e1ea667
          SOLANA_ROI_PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          FORWARD_PROOF_HTTP_TIMEOUT_SECONDS: '45'
          PYTHONUNBUFFERED: '1'
        run: python tests/production_forward_proof_probe.py
