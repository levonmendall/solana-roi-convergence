name: PR405 Composed Hang Isolation

on:
  push:
    branches:
      - repair/robinhood-page-cache-bounded-status

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Reproduce provider-order and sequencer regressions under production composition
        env:
          PYTHONPATH: src
        run: |
          python -u - <<'PY'
          import pytest
          import solana_roi.production

          raise SystemExit(pytest.main([
              '-vv', '-s', '--durations=20',
              'tests/test_robinhood_provider_budget_transport.py',
              'tests/test_robinhood_provider_capacity_budget.py',
              'tests/test_robinhood_provider_efficiency_recovery.py',
              'tests/test_robinhood_provider_failover.py',
              'tests/test_robinhood_provider_pool_throughput_repair.py',
              'tests/test_robinhood_provider_runtime_proof.py',
              'tests/test_robinhood_provider_timeout_thread_boundary.py',
              'tests/test_robinhood_sequencer_frontier.py',
          ]))
          PY
