name: Apply ASGI Bootstrap Lifecycle Repair

on:
  push:
    branches:
      - diagnostic/asgi-bootstrap-memory-retention-runner

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/asgi-bootstrap-memory-retention
          fetch-depth: 0
      - name: Apply smallest post-send cleanup repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/solana_roi/certification_logical_bootstrap.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from fastapi import Header, HTTPException, Query\n'
          new_import = 'from fastapi import BackgroundTasks, Header, HTTPException, Query\n'
          assert text.count(old_import) == 1, 'FastAPI import shape changed'
          text = text.replace(old_import, new_import, 1)

          page_start = text.index('def _page(')
          install_start = text.index('\ndef install_certification_logical_bootstrap(', page_start)
          page = text[page_start:install_start]
          source_line = '    source_path = Path(getattr(store, "path", ""))\n'
          old_finally = '    finally:\n        reader.close()\n        split._drop_file_cache(source_path)\n'
          assert page.count(source_line) == 1, 'page source path shape changed'
          assert page.count(old_finally) == 1, 'page finalizer shape changed'
          page = page.replace(source_line, '', 1)
          page = page.replace(old_finally, '    finally:\n        reader.close()\n', 1)
          text = text[:page_start] + page + text[install_start:]

          route_start = text.index('        @app.get(page_path)', install_start)
          route_end = text.index('    app.state.roi_certification_logical_bootstrap = True', route_start)
          old_route = text[route_start:route_end]
          assert 'return _page(' in old_route, 'page route no longer returns _page directly'
          assert 'BackgroundTasks' not in old_route, 'page route already repaired'

          new_route = (
              '        @app.get(page_path)\n'
              '        def certification_db_logical_bootstrap_page(\n'
              '            background_tasks: BackgroundTasks,\n'
              '            table: str = Query(min_length=1, max_length=256),\n'
              '            epoch: str = Query(min_length=8, max_length=128),\n'
              '            schema_fingerprint: str = Query(min_length=32, max_length=128),\n'
              '            cursor: str | None = Query(default=None, max_length=4096),\n'
              '            limit: int = Query(default=DEFAULT_PAGE_ROWS, ge=1, le=MAX_PAGE_ROWS),\n'
              '            x_certification_token: str | None = Header(default=None, alias="X-Certification-Token"),\n'
              '        ) -> dict[str, Any]:\n'
              '            replication._require_shared_token(x_certification_token)\n'
              '            store = _runtime_store(runtime_provider)\n'
              '            source_path = Path(getattr(store, "path", ""))\n'
              '            try:\n'
              '                payload = _page(\n'
              '                    store,\n'
              '                    table_name=table,\n'
              '                    epoch=epoch,\n'
              '                    fingerprint=schema_fingerprint,\n'
              '                    cursor=cursor,\n'
              '                    limit=limit,\n'
              '                )\n'
              '            except Exception:\n'
              '                # No response will be serialized/sent, so immediate cleanup is safe.\n'
              '                split._drop_file_cache(source_path)\n'
              '                raise\n'
              '            # FastAPI/Starlette executes BackgroundTasks after the response body send.\n'
              '            background_tasks.add_task(split._drop_file_cache, source_path)\n'
              '            return payload\n'
          )
          text = text[:route_start] + new_route + text[route_end:]
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/solana_roi/certification_logical_bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Require ASGI memory regression to turn green before push
        run: python -m pytest -s -vv tests/test_certification_logical_bootstrap_asgi_memory_retention.py
      - name: Commit verified lifecycle repair to diagnostic PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/solana_roi/certification_logical_bootstrap.py
          git commit -m 'Defer logical bootstrap cleanup until ASGI response send'
          git push origin HEAD:diagnostic/asgi-bootstrap-memory-retention
