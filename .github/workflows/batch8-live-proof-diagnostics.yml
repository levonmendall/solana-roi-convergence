name: Batch 8 Live Proof Diagnostics

on:
  push:
    branches:
      - batch8-live-proof-diagnostics-269f1338

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read exact live proof blockers
        env:
          BASE_URL: https://solana-roi-convergence.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = os.environ['BASE_URL'].rstrip('/')
          paths = [
              '/health',
              '/v1/robinhood-chain/status',
              '/v1/strategy/candidate-coverage',
              '/v1/strategy/forward-certification',
              '/v1/strategy/production-proof',
          ]

          def get(path):
              with urllib.request.urlopen(base + path, timeout=60) as r:
                  return json.load(r)

          for path in paths:
              print('\n===', path, '===')
              payload = get(path)
              if path == '/health':
                  keys = ['ok','release_commit','paper_only','live_money_authority','signing_available','transaction_submission_available']
                  print(json.dumps({k: payload.get(k) for k in keys}, indent=2, sort_keys=True))
              elif path == '/v1/robinhood-chain/status':
                  keys = [
                      'runtime_ready','failed_closed','error','caught_up_for_paper_decisions',
                      'paper_decision_transport_ready','v51_proof','worker_isolation','production_install',
                      'paper_only','live_money_authority','signing_available','transaction_submission_available'
                  ]
                  print(json.dumps({k: payload.get(k) for k in keys}, indent=2, sort_keys=True, default=str))
              elif path == '/v1/strategy/candidate-coverage':
                  keys = ['coverage_complete','coverage_debt_count','robinhood_proof_available','robinhood_proof_state','robinhood','candidate_definition','paper_only','live_money_authority']
                  print(json.dumps({k: payload.get(k) for k in keys}, indent=2, sort_keys=True, default=str))
              elif path == '/v1/strategy/forward-certification':
                  checks = payload.get('checks') or {}
                  selected = {str(k): v for k, v in checks.items() if str(k) in {'39','40','41','42','43','44','45','46'} or 'robinhood' in str(k).lower()}
                  keys = ['status','gate','release_commit','batch6_release_gate','blocking_checks','paper_only','live_money_authority']
                  out = {k: payload.get(k) for k in keys}
                  out['selected_checks'] = selected
                  print(json.dumps(out, indent=2, sort_keys=True, default=str))
              else:
                  keys = [
                      'state','production_proof_pass','system_forward_certified','release_commit',
                      'batch6_release_gate','candidate_accounting','classification_anomalies',
                      'orphan_candidate_states','unresolved_production_blockers','eligible_for_production_readiness',
                      'paper_only','live_money_authority','signing_available','transaction_submission_available'
                  ]
                  print(json.dumps({k: payload.get(k) for k in keys}, indent=2, sort_keys=True, default=str))
          PY
