name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The main-history guard must be able to inspect both parents of a merge
          # commit. Depth 1 marks HEAD shallow and hides its parents from revision
          # inspection even though the commit itself is a valid PR merge.
          fetch-depth: 2
      - name: Main history policy backstop
        if: github.event_name == 'push'
        run: |
          test "${{ github.event.forced }}" != "true"
          parents="$(git show -s --format=%P HEAD)"
          test "$(printf '%s\n' "$parents" | wc -w)" -ge 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Audit 11-22 closure regressions
        run: python -m pytest tests/test_audit_11_22_closure.py
      - name: Audit 23-34 evidence-validity regressions
        run: python -m pytest tests/test_v51_evidence_validity_23_34.py
      - name: Audit 35-46 live forward-proof regressions
        run: python -m pytest tests/test_v51_forward_proof_35_46.py tests/test_v51_forward_proof_35_46_final.py
      - name: Audit 47-58 prospective alpha-validation regressions
        run: python -m pytest tests/test_v51_alpha_validation_47_58.py tests/test_alpha_live_proof_convergence.py
      - name: Phase 11 repository truth dependency integrity and authority invariants
        run: python -m pytest tests/test_phase11_repository_cleanup_75_82.py
      - name: Phase 11 dead-module audit
        run: python scripts/audit_dead_modules.py --strict
      - name: Phase 12 final-production import wrapper and black-box E2E
        run: |
          python -m pytest tests/test_v51_phase12_13_83_94.py -k '84 or 85 or 86 or 87 or 88 or 89'
          python -m pytest tests/test_v51_production_path_e2e.py
      - name: Phase 12 prior-state migration regressions
        run: python -m pytest tests/test_v51_phase12_13_83_94.py -k '90'
      - name: Phase 13 work reduction resource backpressure and continuity regressions
        run: |
          python -m pytest tests/test_v51_phase12_13_83_94.py -k '91 or 92 or 93 or 94'
          python -m pytest tests/test_v51_phase13_91_completion.py
      - name: No live-money authority regression
        run: python -m pytest tests/test_v51_phase12_13_83_94.py -k 'preserve_frozen_paper_only_authority'
      - name: Launched production HTTP smoke
        run: python tests/launched_production_smoke.py
      - name: Canonical architecture and transfer-certification invariants
        run: python -m pytest tests/test_five_phase_certification_consolidation.py
      - name: Final v4 wallet entity universe regressions
        run: python -m pytest tests/test_wallet_entity_universe_v4.py
      - name: Existing regressions
        run: python -m pytest --ignore=tests/test_forward_activation.py
      - name: Forward cohort certification regressions
        run: python -m pytest tests/test_forward_activation.py
      - name: Compile production package
        run: python -m compileall -q src
