name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The main-history guard must be able to inspect both parents of a merge
          # commit. Depth 1 marks HEAD shallow and hides its parents from revision
          # inspection even though the commit itself is a valid PR merge.
          fetch-depth: 2
      - name: Main history policy backstop
        if: github.event_name == 'push'
        run: |
          test "${{ github.event.forced }}" != "true"
          parents="$(git show -s --format=%P HEAD)"
          test "$(printf '%s\n' "$parents" | wc -w)" -ge 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Audit 11-22 closure regressions
        run: python -m pytest tests/test_audit_11_22_closure.py
      - name: Audit 23-34 evidence-validity regressions
        run: python -m pytest tests/test_v51_evidence_validity_23_34.py
      - name: Audit 35-46 live forward-proof regressions
        run: python -m pytest tests/test_v51_forward_proof_35_46.py tests/test_v51_forward_proof_35_46_final.py
      - name: Audit 47-58 prospective alpha-validation regressions
        run: python -m pytest tests/test_v51_alpha_validation_47_58.py tests/test_alpha_live_proof_convergence.py
      - name: Phase 11 repository truth dependency integrity and authority invariants
        run: python -m pytest tests/test_phase11_repository_cleanup_75_82.py
      - name: Phase 11 dead-module audit
        run: python scripts/audit_dead_modules.py --strict
      - name: Phase 12 final-production import wrapper and black-box E2E
        run: |
          python -m pytest tests/test_v51_phase12_13_83_94.py -k '84 or 85 or 86 or 87 or 88 or 89'
          python -m pytest tests/test_v51_production_path_e2e.py
      - name: Phase 12 prior-state migration regressions
        run: python -m pytest tests/test_v51_phase12_13_83_94.py -k '90'
      - name: Phase 13 work reduction resource backpressure and continuity regressions
        run: |
          python -m pytest tests/test_v51_phase12_13_83_94.py -k '91 or 92 or 93 or 94'
          python -m pytest tests/test_v51_phase13_91_completion.py
      - name: Phase 14 final profitability proof 95-102
        run: python -m pytest tests/test_v51_phase14_95_102.py
      - name: Phase 15 statistical correctness 103-108
        run: python -m pytest tests/test_v51_repairs_103_108.py tests/test_v51_repairs_103_108_compatibility.py
      - name: Phase 16 exact exit execution integrity 109-113
        run: python -m pytest tests/test_v51_repairs_109_113.py tests/test_v51_phase16_terminal_fomo_followup.py
      - name: Phase 16 exit survivability analytics 114
        run: python -m pytest tests/test_v51_repair_114_exit_survivability.py
      - name: Phase 17 scoped context certification 115-120
        run: python -m pytest tests/test_v51_phase17_115_120.py
      - name: Phase 18 monkeypatch migration inventory
        run: python scripts/audit_monkeypatch_debt.py
      - name: Phase 18 production architecture consolidation 125-130
        run: python -m pytest tests/test_v51_phase18_125_130_architecture.py
      - name: No live-money authority regression
        run: python -m pytest tests/test_v51_phase12_13_83_94.py -k 'preserve_frozen_paper_only_authority'
      - name: Launched production HTTP smoke
        run: python tests/launched_production_smoke.py
      - name: Canonical architecture and transfer-certification invariants
        run: python -m pytest tests/test_five_phase_certification_consolidation.py
      - name: Final v4 wallet entity universe regressions
        run: python -m pytest tests/test_wallet_entity_universe_v4.py
      - name: Existing regressions
        run: |
          # Component compatibility modules are mutation-heavy by historical design.
          # Run each native contract in its own interpreter so collection of one
          # module cannot replace another module's functions before its tests run.
          python - <<'PY'
          import pytest
          from solana_roi import candidate_risk_window_repair as compatibility
          compatibility.install_candidate_risk_window_repair()
          raise SystemExit(pytest.main([
              "tests/test_candidate_risk_window_repair.py",
              "--junitxml=existing-regressions-native-candidate-risk.xml",
          ]))
          PY
          python -m pytest tests/test_continuity_storage_capacity_repair.py --junitxml=existing-regressions-native-continuity-storage.xml
          python -m pytest tests/test_fomo_continuation_shadow.py --junitxml=existing-regressions-native-fomo-shadow.xml
          python -m pytest tests/test_fomo_feature_boundaries.py --junitxml=existing-regressions-native-fomo-boundaries.xml
          python -m pytest tests/test_fomo_risk_conditioned_v5.py --junitxml=existing-regressions-native-fomo-v5.xml
          python - <<'PY'
          import pytest
          from solana_roi.target_quorum import install_target_quorum
          from solana_roi.live_poll_redundancy import install_live_poll_redundancy
          from solana_roi.poll_watermark_repair import install_poll_watermark_repair
          install_target_quorum()
          install_live_poll_redundancy()
          install_poll_watermark_repair()
          raise SystemExit(pytest.main([
              "tests/test_live_poll_redundancy.py",
              "--junitxml=existing-regressions-native-live-poll.xml",
          ]))
          PY
          python -m pytest tests/test_observation.py --junitxml=existing-regressions-native-observation.xml
          python - <<'PY'
          import pytest
          from solana_roi.live_poll_redundancy import install_live_poll_redundancy
          from solana_roi.poll_watermark_repair import install_poll_watermark_repair
          from solana_roi.poll_pagination_context import install_poll_pagination_context
          install_live_poll_redundancy()
          install_poll_watermark_repair()
          install_poll_pagination_context()
          from solana_roi.poll_exception_rearm import install_poll_exception_rearm
          install_poll_exception_rearm()
          raise SystemExit(pytest.main([
              "tests/test_poll_watermark_repair.py",
              "--junitxml=existing-regressions-native-poll-watermark.xml",
          ]))
          PY
          python -m pytest tests/test_prospective_observation.py --junitxml=existing-regressions-native-prospective.xml
          python - <<'PY'
          import pytest
          import solana_roi.production  # explicit Phase-18 production composition

          raise SystemExit(pytest.main([
              "--ignore=tests/test_forward_activation.py",
              "--ignore=tests/test_candidate_risk_window_repair.py",
              "--ignore=tests/test_continuity_storage_capacity_repair.py",
              "--ignore=tests/test_fomo_continuation_shadow.py",
              "--ignore=tests/test_fomo_feature_boundaries.py",
              "--ignore=tests/test_fomo_risk_conditioned_v5.py",
              "--ignore=tests/test_live_poll_redundancy.py",
              "--ignore=tests/test_observation.py",
              "--ignore=tests/test_poll_watermark_repair.py",
              "--ignore=tests/test_prospective_observation.py",
              "--junitxml=existing-regressions-composed.xml",
          ]))
          PY
      - name: Upload existing regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: existing-regressions-*.xml
          if-no-files-found: error
      - name: Forward cohort certification regressions
        run: python -m pytest tests/test_forward_activation.py
      - name: Compile production package
        run: python -m compileall -q src
