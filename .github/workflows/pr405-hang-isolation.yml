name: PR405 Hang Isolation

on:
  push:
    branches:
      - repair/robinhood-page-cache-bounded-status

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Show exact test boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          names = sorted(str(p) for p in Path('tests').glob('test_*.py'))
          target = 'tests/test_robinhood_provider_runtime_proof.py'
          i = names.index(target)
          print('\n'.join(names[max(0, i-3):i+6]))
          PY
      - name: Timeout boundary alone under production composition
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=5s 45s python -u - <<'PY'
          import faulthandler
          import pytest
          import solana_roi.production
          faulthandler.enable()
          faulthandler.dump_traceback_later(10, repeat=True)
          raise SystemExit(pytest.main([
              '-vv', '-s',
              'tests/test_robinhood_provider_timeout_thread_boundary.py',
          ]))
          PY
      - name: Runtime proof then timeout boundary under production composition
        continue-on-error: true
        run: |
          timeout --signal=TERM --kill-after=5s 60s python -u - <<'PY'
          import faulthandler
          import pytest
          import solana_roi.production
          faulthandler.enable()
          faulthandler.dump_traceback_later(10, repeat=True)
          raise SystemExit(pytest.main([
              '-vv', '-s',
              'tests/test_robinhood_provider_runtime_proof.py',
              'tests/test_robinhood_provider_timeout_thread_boundary.py',
          ]))
          PY
