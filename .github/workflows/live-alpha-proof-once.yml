name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Robinhood transport kind
        run: |
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://solana-roi-convergence.onrender.com/v1/strategy/e2e-status',headers={'Accept':'application/json','User-Agent':'roi-rh-provider-inspect/1'})
          with urllib.request.urlopen(req,timeout=90) as r:
              e=json.loads(r.read().decode())
          rh=e.get('robinhood') or {}
          print(json.dumps({
              'release_commit':e.get('release_commit'),
              'rpc_endpoint_kind':rh.get('rpc_endpoint_kind'),
              'runtime_ready':rh.get('runtime_ready'),
              'paper_decision_transport_ready':rh.get('paper_decision_transport_ready'),
              'blockers':rh.get('blockers'),
              'forward_frontier_readiness':rh.get('forward_frontier_readiness'),
              'live_frontier_verification':rh.get('live_frontier_verification'),
          },sort_keys=True,default=str))
          PY
