name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect exact final Robinhood frontier internals
        run: |
          python - <<'PY'
          import json, urllib.request
          def get(path):
              req=urllib.request.Request('https://solana-roi-convergence.onrender.com'+path,headers={'Accept':'application/json','User-Agent':'roi-rh-frontier-inspect/1'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode())
          e=get('/v1/strategy/e2e-status')
          rh=e.get('robinhood') or {}
          print('RELEASE',e.get('release_commit'))
          print('RH',json.dumps({
              'runtime_ready':rh.get('runtime_ready'),
              'failed_closed':rh.get('failed_closed'),
              'paper_decision_transport_ready':rh.get('paper_decision_transport_ready'),
              'forward_frontier_ready':rh.get('forward_frontier_ready'),
              'blockers':rh.get('blockers'),
              'last_error':rh.get('last_error'),
              'error':rh.get('error'),
              'rpc_failures':rh.get('rpc_failures'),
              'forward_frontier_readiness':rh.get('forward_frontier_readiness'),
              'live_frontier_verification':rh.get('live_frontier_verification'),
              'worker_isolation':rh.get('worker_isolation'),
              'v51_proof':rh.get('v51_proof'),
          },sort_keys=True,default=str))
          PY
