name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify final production Robinhood provider authority
        run: |
          python - <<'PY'
          import json, urllib.request

          URL='https://solana-roi-convergence.onrender.com/v1/strategy/e2e-status'
          EXPECTED='404c435b22082ca9404a9420bfde3d54fb3e16b4'
          req=urllib.request.Request(URL,headers={'Accept':'application/json','User-Agent':'roi-final-provider-proof/1'})
          with urllib.request.urlopen(req,timeout=60) as r:
              payload=json.loads(r.read().decode())
          rh=payload.get('robinhood') or {}
          provider=rh.get('production_transport_authority') or {}
          summary={
              'release_commit': payload.get('release_commit'),
              'paper_only': (payload.get('overall') or {}).get('paper_only'),
              'live_money_authority': (payload.get('overall') or {}).get('live_money_authority'),
              'robinhood_runtime_ready': rh.get('runtime_ready'),
              'robinhood_failed_closed': rh.get('failed_closed'),
              'robinhood_error': rh.get('error'),
              'provider_configured': provider.get('provider_configured'),
              'decision_authoritative': provider.get('decision_authoritative'),
              'provider_blocker': provider.get('blocker'),
              'canonical_latency_hard_max_seconds': provider.get('canonical_latency_hard_max_seconds'),
              'legacy_two_block_gate_has_production_authority': provider.get('legacy_two_block_gate_has_production_authority'),
              'public_rpc_is_research_observation_only': provider.get('public_rpc_is_research_observation_only'),
              'public_sequencer_is_research_observation_only': provider.get('public_sequencer_is_research_observation_only'),
              'signing_available': provider.get('signing_available'),
              'transaction_submission_available': provider.get('transaction_submission_available'),
          }
          print('FINAL_PRODUCTION',json.dumps(summary,sort_keys=True))
          if summary['release_commit'] != EXPECTED:
              raise SystemExit('wrong production release')
          if summary['paper_only'] is not True or summary['live_money_authority'] is not False:
              raise SystemExit('paper-only boundary changed')
          if summary['canonical_latency_hard_max_seconds'] != 20.0:
              raise SystemExit('canonical v5.1 latency authority changed')
          if summary['legacy_two_block_gate_has_production_authority'] is not False:
              raise SystemExit('legacy two-block gate still has production authority')
          if summary['signing_available'] is not False or summary['transaction_submission_available'] is not False:
              raise SystemExit('execution authority unexpectedly available')
          # Credential handoff is external. Until Render has a non-public RPC/WSS pair,
          # production must fail closed explicitly rather than use the public transport.
          if summary['provider_configured'] is False:
              if summary['decision_authoritative'] is not False:
                  raise SystemExit('public transport incorrectly decision-authoritative')
              if summary['provider_blocker'] != 'robinhood_production_rpc_websocket_required':
                  raise SystemExit('missing provider did not fail closed precisely')
          PY
