name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public sequencer feed
        run: |
          python -m pip install -q websockets==15.0.1
          python - <<'PY'
          import asyncio, json
          import websockets
          URL='wss://feed.mainnet.chain.robinhood.com'
          async def main():
              async with websockets.connect(URL,open_timeout=10,close_timeout=3,ping_interval=20,max_size=8*1024*1024) as ws:
                  raw=await asyncio.wait_for(ws.recv(),timeout=10)
                  print('BYTES',len(raw))
                  obj=json.loads(raw)
                  print('TOP_KEYS',sorted(obj.keys()))
                  msgs=obj.get('messages') or obj.get('Messages') or []
                  print('MSG_COUNT',len(msgs))
                  if msgs:
                      m=msgs[0]
                      print('MSG_KEYS',sorted(m.keys()))
                      print('SEQUENCE',m.get('sequenceNumber'),m.get('sequence_number'),m.get('sequence'))
                      print('BLOCKHASH',m.get('blockHash'),m.get('block_hash'))
                      inner=m.get('message') or m.get('Message') or {}
                      if isinstance(inner,dict):
                          print('INNER_KEYS',sorted(inner.keys()))
                          header=inner.get('message') or inner.get('Message') or inner
                          if isinstance(header,dict):
                              print('INNER2_KEYS',sorted(header.keys())[:30])
          asyncio.run(main())
          PY
