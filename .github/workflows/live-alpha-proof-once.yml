name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe public WSS JSON-RPC
        run: |
          python -m pip install -q websockets==15.0.1
          python - <<'PY'
          import asyncio, json
          import websockets
          URL='wss://rpc.mainnet.chain.robinhood.com'
          async def main():
              try:
                  async with websockets.connect(URL,open_timeout=10,close_timeout=3,ping_interval=20) as ws:
                      await ws.send(json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_chainId','params':[]}))
                      print('CHAIN',await asyncio.wait_for(ws.recv(),timeout=10))
                      await ws.send(json.dumps({'jsonrpc':'2.0','id':2,'method':'eth_subscribe','params':['newHeads']}))
                      reply=json.loads(await asyncio.wait_for(ws.recv(),timeout=10))
                      print('SUB',json.dumps(reply,sort_keys=True))
                      if 'result' not in reply:
                          raise SystemExit(2)
                      for i in range(3):
                          msg=json.loads(await asyncio.wait_for(ws.recv(),timeout=10))
                          params=msg.get('params') or {}
                          result=params.get('result') or {}
                          print('HEAD',i+1,result.get('number'),result.get('hash'))
              except Exception as exc:
                  print('WSS_ERROR',type(exc).__name__,str(exc))
                  raise
          asyncio.run(main())
          PY
