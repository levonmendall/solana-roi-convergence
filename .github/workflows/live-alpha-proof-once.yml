name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure public sequencer cadence
        run: |
          python -m pip install -q websockets==15.0.1
          python - <<'PY'
          import asyncio, json, time
          import websockets

          URL='wss://feed.mainnet.chain.robinhood.com'

          async def main():
              async with websockets.connect(URL,open_timeout=10,close_timeout=3,ping_interval=20,max_size=8*1024*1024) as ws:
                  prior_t=None
                  prior_seq=None
                  for i in range(12):
                      t0=time.monotonic()
                      raw=await asyncio.wait_for(ws.recv(),timeout=30)
                      now=time.monotonic()
                      obj=json.loads(raw)
                      msgs=obj.get('messages') or []
                      seqs=[int(m['sequenceNumber']) for m in msgs if isinstance(m,dict) and m.get('sequenceNumber') is not None]
                      latest=max(seqs) if seqs else None
                      print('FEED',i+1,'wait_s',round(now-t0,4),'since_prior_s',None if prior_t is None else round(now-prior_t,4),'messages',len(msgs),'min_seq',min(seqs) if seqs else None,'max_seq',latest,'seq_delta',None if prior_seq is None or latest is None else latest-prior_seq)
                      prior_t=now
                      prior_seq=latest
          asyncio.run(main())
          PY
