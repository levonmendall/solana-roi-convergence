name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Benchmark exact-block log acquisition
        run: |
          python -m pip install -q websockets==15.0.1
          python - <<'PY'
          import asyncio, json, time, urllib.request
          import websockets
          FEED='wss://feed.mainnet.chain.robinhood.com'
          RPC='https://rpc.mainnet.chain.robinhood.com'
          topics=[
            '0x783cca1c0412dd0d695e784568c96da2e9c22ff989357a2e8b1d9b2b4e6b7118',
            '0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67',
            '0xdb51ea9ad51ab453a65a4cb7e60c3cb378c9501bb002609f8f97778fb6c4235a',
            '0x8d4aad4953d0ca700d468f3753aa14432d1b35b43ec6409f051fb6aa43a89607',
            '0xec36bf571f136799e8dc0b0b8bea4b04d8bd3d43de838aab0d5fc21d4cbfc455',
            '0x8113d738abdcb6b38357e9d53a54a7157861a09031b453651f0fe7fe151f59df',
          ]
          def rpc(method,params):
              body=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req=urllib.request.Request(RPC,data=body,headers={'Content-Type':'application/json','User-Agent':'roi-exact-block-bench/1'})
              t=time.perf_counter()
              with urllib.request.urlopen(req,timeout=10) as r:
                  obj=json.loads(r.read().decode())
              return obj,time.perf_counter()-t
          async def main():
              async with websockets.connect(FEED,open_timeout=10,close_timeout=3,ping_interval=20,max_size=8*1024*1024) as ws:
                  for i in range(5):
                      raw=await asyncio.wait_for(ws.recv(),timeout=10)
                      m=(json.loads(raw).get('messages') or [])[0]
                      block=int(m['sequenceNumber'])
                      filt={'fromBlock':hex(block),'toBlock':hex(block),'topics':[topics]}
                      result,elapsed=await asyncio.to_thread(rpc,'eth_getLogs',[filt])
                      latest,head_elapsed=await asyncio.to_thread(rpc,'eth_blockNumber',[])
                      head=int(latest.get('result') or '0x0',16)
                      print('SAMPLE',i+1,'block',block,'head',head,'lag',max(0,head-block),'log_seconds',round(elapsed,4),'head_seconds',round(head_elapsed,4),'logs',len(result.get('result') or []),'error',result.get('error'))
          asyncio.run(main())
          PY
