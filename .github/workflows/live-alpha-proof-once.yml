name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample final production sequencer frontier
        run: |
          python - <<'PY'
          import json, time, urllib.request

          BASE='https://solana-roi-convergence.onrender.com'
          EXPECTED='81e77eeae04c43ff3d9d2f7e597e77348829ab32'

          def get(path):
              req=urllib.request.Request(BASE+path,headers={'Accept':'application/json','User-Agent':'roi-final-sequencer-proof/1'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode())

          samples=[]
          for i in range(12):
              e=get('/v1/strategy/e2e-status')
              rh=e.get('robinhood') or {}
              seq=rh.get('sequencer_frontier') or {}
              live=rh.get('live_frontier_verification') or {}
              iso=rh.get('worker_isolation') or {}
              proof=rh.get('v51_proof') or {}
              s={
                  'i':i+1,
                  'release':e.get('release_commit'),
                  'runtime_ready':rh.get('runtime_ready'),
                  'failed_closed':rh.get('failed_closed'),
                  'transport_ready':rh.get('paper_decision_transport_ready'),
                  'caught_up':rh.get('caught_up_for_paper_decisions'),
                  'blockers':rh.get('blockers'),
                  'seq_connected':seq.get('connected'),
                  'seq_sync':seq.get('synchronized'),
                  'seq_fresh':seq.get('fresh'),
                  'seq_head':seq.get('head_block'),
                  'seq_cursor':seq.get('processing_cursor_block'),
                  'seq_lag':seq.get('processing_lag_blocks'),
                  'seq_generation':seq.get('generation'),
                  'seq_disconnects':seq.get('disconnects'),
                  'live_ready':live.get('live_epoch_ready'),
                  'live_lag':live.get('live_epoch_lag_blocks'),
                  'range':live.get('last_range'),
                  'status_cache_stale':iso.get('status_cache_stale'),
                  'status_cache_age':iso.get('status_cache_age_seconds'),
                  'proof_available':proof.get('available'),
                  'proof_topology':proof.get('proof_refresh_topology'),
              }
              samples.append(s)
              print('SAMPLE',json.dumps(s,sort_keys=True,default=str))
              if i < 11:
                  time.sleep(2)

          releases={s['release'] for s in samples}
          ready=sum(1 for s in samples if s['runtime_ready'] is True and s['failed_closed'] is not True and s['transport_ready'] is True)
          seq_ready=sum(1 for s in samples if s['seq_connected'] is True and s['seq_sync'] is True and s['seq_fresh'] is True and isinstance(s['seq_lag'],int) and s['seq_lag'] <= 2)
          stale=sum(1 for s in samples if s['status_cache_stale'] is True)
          generations={s['seq_generation'] for s in samples}
          disconnects=[s['seq_disconnects'] for s in samples if isinstance(s['seq_disconnects'],int)]
          proof_seen=any(s['proof_available'] is True for s in samples)
          summary={
              'expected_release':EXPECTED,
              'releases':sorted(str(x) for x in releases),
              'samples':len(samples),
              'ready_samples':ready,
              'sequencer_ready_samples':seq_ready,
              'status_cache_stale_samples':stale,
              'sequencer_generations':sorted(str(x) for x in generations),
              'max_disconnects':max(disconnects) if disconnects else None,
              'proof_available_seen':proof_seen,
          }
          print('SUMMARY',json.dumps(summary,sort_keys=True))
          if releases != {EXPECTED}:
              raise SystemExit('wrong production release')
          if ready < 9:
              raise SystemExit('Robinhood transport not stably ready')
          if seq_ready < 9:
              raise SystemExit('sequencer frontier not stably within two blocks')
          if stale:
              raise SystemExit('Robinhood status cache became stale')
          if len(generations) != 1:
              raise SystemExit('sequencer feed reconnected during proof window')
          if not proof_seen:
              raise SystemExit('offloaded Robinhood proof never became available')
          PY
