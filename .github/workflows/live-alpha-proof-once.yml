name: Live Alpha Proof Once

on:
  push:
    branches: [verify/alpha-f2d0]

permissions:
  contents: read

jobs:
  verify-live-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect direct Solana and FOMO continuity
        run: |
          python - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://solana-roi-convergence.onrender.com/v1/strategy/e2e-status',headers={'Accept':'application/json','User-Agent':'roi-solana-continuity/1'})
          with urllib.request.urlopen(req,timeout=90) as r:
              e=json.loads(r.read().decode())
          print('RELEASE',e.get('release_commit'))
          print('SOLANA',json.dumps(e.get('solana'),sort_keys=True,default=str))
          print('FOMO',json.dumps(e.get('fomo'),sort_keys=True,default=str))
          print('OVERALL',json.dumps(e.get('overall'),sort_keys=True,default=str))
          PY
