name: Diagnostic Paper Lifecycle Live Proof

on:
  push:
    branches:
      - diagnostic/paper-lifecycle-live-proof

permissions:
  contents: read

jobs:
  live-paper-lifecycle-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact launched release continuity and lifecycle
        env:
          PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          EXPECTED_RELEASE_COMMIT: 3779a24dcdd01c640eaf8ae39b82c898eb4e983f
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = os.environ['PRODUCTION_URL'].rstrip('/')
          expected = os.environ['EXPECTED_RELEASE_COMMIT']

          def get(path, timeout=80):
              req = urllib.request.Request(
                  base + path,
                  headers={'Accept':'application/json','User-Agent':'paper-lifecycle-exact-release-probe/2'},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  payload = json.loads(response.read().decode('utf-8'))
                  print(f'HTTP {response.status} {path}', flush=True)
                  return payload

          health = get('/health', 20)
          composition = get('/v1/operations/production-composition', 30)
          e2e = get('/v1/strategy/e2e-status', 80)

          release = composition.get('release_commit') or composition.get('commit')
          if release != expected:
              raise SystemExit(f'wrong launched release: expected={expected} actual={release}')

          lifecycle = composition.get('paper_execution_lifecycle') or {}
          semantics = composition.get('health_semantics') or {}
          direct = ((e2e.get('solana') or {}).get('transport_diagnostics') or {}).get('strategy_relevant_continuity') or {}

          summary = {
              'expected_release_commit': expected,
              'health': health,
              'composition_release_commit': release,
              'health_semantics': semantics,
              'paper_execution_lifecycle': lifecycle,
              'strategy_relevant_continuity': direct,
              'solana': e2e.get('solana'),
              'fomo': e2e.get('fomo'),
              'robinhood': e2e.get('robinhood'),
              'overall': e2e.get('overall'),
          }
          print('=== LIVE_EXACT_RELEASE_SUMMARY ===', flush=True)
          print(json.dumps(summary, sort_keys=True), flush=True)
          PY
