name: Diagnostic Paper Lifecycle Live Proof

on:
  push:
    branches:
      - diagnostic/paper-lifecycle-live-proof

permissions:
  contents: read

jobs:
  live-paper-lifecycle-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read launched production lifecycle truth
        env:
          PRODUCTION_URL: https://solana-roi-convergence.onrender.com
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = os.environ['PRODUCTION_URL'].rstrip('/')
          for path in ('/health', '/v1/operations/production-composition'):
              print(f'=== {path} ===', flush=True)
              request = urllib.request.Request(base + path, headers={'Accept':'application/json','User-Agent':'paper-lifecycle-truth-probe/1'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read().decode('utf-8'))
                  print(f'HTTP {response.status}', flush=True)
                  print(json.dumps(payload, sort_keys=True), flush=True)
          PY
