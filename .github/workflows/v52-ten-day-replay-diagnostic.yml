name: v52-ten-day-replay-diagnostic

on:
  push:
    branches:
      - diagnostic/v52-ten-day-replay-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-readonly-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CERT_TOKEN: ${{ secrets.SOLANA_ROI_CERTIFICATION_SHARED_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Page current authenticated read-only evidence tables
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          base = "https://solana-roi-convergence.onrender.com"
          epoch = "aujNKhdJlQURx1AtMXciTvUwmXTMsz_m"
          fp = "a5ade0f3e2d2fbeaea49bcd531add8509b7f27acb71d04f1b73d7d31ccb3c648"
          token = os.getenv("CERT_TOKEN", "")
          print("CERT_TOKEN_PRESENT=" + ("yes" if token else "no"))
          tables = [
              "risk_conditioned_alpha_v5_trials",
              "risk_conditioned_alpha_v5_outcomes",
              "robinhood_paper_trials",
              "v51_candidates",
              "v51_candidate_stage_events",
              "v51_candidate_current_state",
              "v51_candidate_pipeline_audit",
              "profit_first_entity_forward_outcomes",
              "profit_first_entity_shadow_trials",
              "profit_first_final_epochs",
              "profit_first_final_exit_execution_attempts",
              "profit_first_final_exit_liquidations",
              "profit_first_final_exit_signals",
              "profit_first_final_outcome_execution_models",
              "profit_first_final_outcomes",
              "profit_first_final_trials",
              "candidate_compute_admission_decisions",
              "candidate_execution_plane_snapshots",
              "ephemeral_candidate_state",
              "v52_market_validation_point_in_time",
              "v52_market_validation_shadow_outcomes",
              "v52_wallet_forward_outcomes",
              "v52_wallet_forward_validation",
              "normalized_swaps",
              "market_quotes",
              "events",
          ]
          def get(table):
              qs = urllib.parse.urlencode({"table":table,"epoch":epoch,"schema_fingerprint":fp,"limit":20})
              url = base + "/v1/operations/certification-db-logical-bootstrap-page?" + qs
              req = urllib.request.Request(url)
              if token:
                  req.add_header("X-Certification-Token", token)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw=r.read().decode("utf-8","replace")
                      print(f"=== TABLE {table} status={r.status} bytes={len(raw)} ===")
                      print(raw[:120000])
              except urllib.error.HTTPError as e:
                  raw=e.read().decode("utf-8","replace")
                  print(f"=== TABLE {table} status={e.code} bytes={len(raw)} ===")
                  print(raw[:20000])
              except Exception as exc:
                  print(f"=== TABLE {table} ERROR {type(exc).__name__}: {exc} ===")
          for table in tables:
              get(table)
          PY
