services:
  - type: web
    name: solana-roi-convergence
    runtime: python
    plan: 1c-2g
    buildCommand: pip install -e .
    startCommand: uvicorn solana_roi.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: off
    numInstances: 1
    disk:
      name: roi-convergence-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PAPER_ONLY
        value: "true"
      - key: SOLANA_NETWORK
        value: mainnet-beta
      - key: SOLANA_ROI_DB_PATH
        value: /var/data/solana-roi.sqlite3
      - key: SOLANA_ROI_PROGRAM_WIDE_SWAP_COVERAGE
        value: "true"
      - key: SOLANA_ROI_SHADOW_CLOCK_ENABLED
        value: "true"
      - key: SOLANA_ROI_SHADOW_CLOCK_SECONDS
        value: "1.0"
      - key: SOLANA_ROI_PRICE_TRACKING_HORIZON_SECONDS
        value: "300"
      # Frozen public scout cohort used by the v3.1 hypothesis. These are public
      # Solana addresses only; no key material is stored or accepted.
      - key: SOLANA_ROI_WALLET_PROFILES_JSON
        value: '[{"wallet":"4BdKaxN8G6ka4GYtQQWk4G4dZRUTX2vQH9GcXdBREFUk","entity_id":"kol:jijo","tier":"S","first_touch_sample_size":191,"historically_eligible":true},{"wallet":"862TYSvRYoiHAK3F3WwTRYAfuGiQaGdxedN9AGvRGWo2","entity_id":"kol:wugi","tier":"S","first_touch_sample_size":52,"historically_eligible":true},{"wallet":"DYAn4XpAkN5mhiXkRB7dGq4Jadnx6XYgu8L5b3WGhbrt","entity_id":"kol:the-doc","tier":"S","first_touch_sample_size":121,"historically_eligible":true}]'
      # Provider credentials still require user-owned accounts and are prompted
      # during initial Blueprint creation. They are never committed.
      - key: HELIUS_API_KEY
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      # Render generates these internal 256-bit secrets. The Helius bootstrap
      # registers the generated webhook auth header automatically.
      - key: HELIUS_WEBHOOK_AUTH
        generateValue: true
      - key: SOLANA_ROI_COHORT_ARM_AUTH
        generateValue: true
      # Public address only. No private key, signer, seed phrase, or mnemonic.
      - key: SOLANA_ROI_SHADOW_WALLET_PUBLIC_KEY
        sync: false
